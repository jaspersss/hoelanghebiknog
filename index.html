<!DOCTYPE html>
<html lang="nl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memento Mori</title>
    <style>
        :root {
            --bg-color: #000000;
            --glass-bg: rgba(30, 30, 32, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ED;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #setup-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        h2 { margin: 0 0 10px 0; font-weight: 600; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 0.9em; margin-bottom: 30px; line-height: 1.5; }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.85em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        input, select, button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #333;
            background-color: rgba(0,0,0,0.4);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input:focus, select:focus { border-color: var(--accent); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }

        button {
            background-color: var(--accent);
            border: none;
            color: white;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover { background-color: var(--accent-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #333; color: #888; cursor: not-allowed; }

        #fullscreen-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .time-wrapper {
            display: flex;
            gap: 3vw;
            align-items: baseline;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .time-value {
            font-size: 7vw;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            line-height: 1;
        }

        .time-label {
            font-size: 1.2vw;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        #meta-info {
            position: absolute;
            bottom: 40px;
            color: var(--text-muted);
            font-size: 0.9em;
            text-align: center;
            opacity: 0.5;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* Nieuwe CSS klasse voor de reservetijd melding */
        .reserve-mode {
            font-size: 2.5em !important;
            color: #32d74b !important; /* Fel groen */
            font-weight: bold;
            text-transform: uppercase;
            opacity: 1 !important;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(50, 215, 75, 0.4);
        }

        .exit-hint {
            position: absolute;
            top: 30px;
            color: #444;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 800px) {
            .time-value { font-size: 11vw; }
            .time-label { font-size: 3vw; }
            .time-wrapper { gap: 4vw; row-gap: 40px; }
            .reserve-mode { font-size: 1.5em !important; }
        }
    </style>
</head>

        async function fetchLiveLifeExpectancy(gender, countryCode) {
            const indicator = gender === 'man' ? 'SP.DYN.LE00.MA.IN' : 'SP.DYN.LE00.FE.IN';
            const url = `https://api.worldbank.org/v2/country/${countryCode}/indicator/${indicator}?format=json`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data && data[1]) {
                    const records = data[1];
                    const latestRecord = records.find(record => record.value !== null);
                    if (latestRecord) return { age: latestRecord.value, year: latestRecord.date };
                }
            } catch (error) {
                console.error("API Error:", error);
            }
            return gender === 'man' ? { age: 80.0, year: 'Fallback' } : { age: 83.0, year: 'Fallback' };
        }

            setupContainer.style.display = 'none';
            fullScreenContainer.style.display = 'flex';

            // Reset eventuele styling van vorige sessies
            metaInfoElement.className = '';
            originalMetaText = `${t.expectancyText}: ${lifeExpectancyYears.toFixed(2)} ${t.yearsWord} (${t.source} ${apiData.year})`;
            metaInfoElement.innerText = originalMetaText;

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            }

            startTimerLogic(new Date(birthdateInput), lifeExpectancyYears);
        }

        function startTimerLogic(birthDate, lifeExpectancyYears) {
            clearInterval(countdownInterval);
            
            const expectedDeathDate = new Date(birthDate.getTime() + (lifeExpectancyYears * 365.2425 * 24 * 60 * 60 * 1000));

            const elYears = document.getElementById('val-years');
            const elDays = document.getElementById('val-days');
            const elHours = document.getElementById('val-hours');
            const elMinutes = document.getElementById('val-minutes');
            const elSeconds = document.getElementById('val-seconds');
            const metaInfoElement = document.getElementById('meta-info');

            countdownInterval = setInterval(() => {
                const now = new Date();
                
                // Verschil in milliseconden. Negatief betekent dat de persoon de verwachte datum is gepasseerd.
                const diffMilliseconds = expectedDeathDate - now;
                const isBonusTime = diffMilliseconds < 0;
                
                // Bereken altijd met absolute waarden zodat hij feilloos optelt of aftelt
                const absoluteDiff = Math.abs(diffMilliseconds);

                const totalSecondsLeft = Math.floor(absoluteDiff / 1000);
                const totalDaysLeft = Math.floor(totalSecondsLeft / (3600 * 24));

                const years = Math.floor(totalDaysLeft / 365.2425);
                const days = Math.floor(totalDaysLeft % 365.2425);
                const hours = Math.floor((totalSecondsLeft / 3600) % 24);
                const minutes = Math.floor((totalSecondsLeft / 60) % 60);
                const seconds = totalSecondsLeft % 60;

                // Opmaak van de jaren: voeg de '+' toe als we in bonustijd zitten
                let yearsDisplay = years.toString().padStart(2, '0');
                
                if (isBonusTime) {
                    yearsDisplay = "+" + yearsDisplay;
                    metaInfoElement.innerText = t.reserveTime;
                    metaInfoElement.classList.add('reserve-mode');
                } else {
                    metaInfoElement.innerText = originalMetaText;
                    metaInfoElement.classList.remove('reserve-mode');
                }

                elYears.innerText = yearsDisplay;
                elDays.innerText = days.toString().padStart(3, '0');
                elHours.innerText = hours.toString().padStart(2, '0');
                elMinutes.innerText = minutes.toString().padStart(2, '0');
                elSeconds.innerText = seconds.toString().padStart(2, '0');

            }, 1000);
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                clearInterval(countdownInterval);
                document.getElementById('fullscreen-container').style.display = 'none';
                document.getElementById('setup-container').style.display = 'block';
            }
        });
    </script>
</body>
</html>
